name: Kernel build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential binutils

      - name: Build freestanding kernel ELF
        run: make clean all

      - name: Verify ELF architecture and entry point
        run: |
          file build/dodo-kernel.elf
          readelf -h build/dodo-kernel.elf
          readelf -h build/dodo-kernel.elf | grep -q 'Advanced Micro Devices X86-64'
          nm build/dodo-kernel.elf | grep -q ' T _start$'
