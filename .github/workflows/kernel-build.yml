name: DODO kernel and boot test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils curl xorriso qemu-system-x86 ovmf python3

      - name: Run host memory allocator tests
        run: make test

      - name: Build kernel and bootable ISO
        run: make clean all

      - name: Verify ELF architecture, entry point, and load segments
        run: |
          file build/dodo-kernel.elf
          readelf -h build/dodo-kernel.elf
          readelf -l build/dodo-kernel.elf
          readelf -h build/dodo-kernel.elf | grep -q 'Advanced Micro Devices X86-64'
          nm build/dodo-kernel.elf | grep -q ' T _start$'
          python3 tests/verify_elf_layout.py build/dodo-kernel.elf

      - name: Boot ISO through BIOS and verify kernel serial output
        run: make qemu-smoke

      - name: Boot ISO through UEFI firmware and verify shell input
        run: make qemu-uefi-smoke

      - name: Verify PS/2 keyboard input through QEMU
        run: make qemu-keyboard-smoke

      - name: Verify unexpected exception panic diagnostics through QEMU
        run: make qemu-panic-smoke

      - name: Generate and verify ISO SHA-256 checksum
        run: |
          test -s build/dodo-os.iso
          sha256sum build/dodo-os.iso | tee build/dodo-os.iso.sha256
          sha256sum --check build/dodo-os.iso.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: dodo-os-bootable-iso
          path: |
            build/dodo-os.iso
            build/dodo-os.iso.sha256
          if-no-files-found: error
          retention-days: 14

  windows-checksum-helper:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify checksum helper accepts valid digest and rejects invalid digest
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'dodo-checksum-test'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $isoPath = Join-Path $testRoot 'dodo-os.iso'
          $checksumPath = Join-Path $testRoot 'dodo-os.iso.sha256'
          [System.IO.File]::WriteAllBytes($isoPath, [byte[]](0, 1, 2, 3, 254, 255))
          $hash = (Get-FileHash -LiteralPath $isoPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -NoNewline -Value "$hash  build/dodo-os.iso"
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\verify_iso_hash.ps1'
          $good = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile', '-File', $script, '-IsoPath', $isoPath, '-ChecksumPath', $checksumPath) -Wait -PassThru -NoNewWindow
          if ($good.ExitCode -ne 0) { throw "Checksum helper rejected a valid image (exit $($good.ExitCode))." }
          Set-Content -LiteralPath $checksumPath -NoNewline -Value "$(('0' * 64))  build/dodo-os.iso"
          $bad = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile', '-File', $script, '-IsoPath', $isoPath, '-ChecksumPath', $checksumPath) -Wait -PassThru -NoNewWindow
          if ($bad.ExitCode -eq 0) { throw 'Checksum helper accepted an invalid digest.' }
